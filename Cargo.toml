[workspace]
resolver =  "3"
default-members = ["wwwidgets", "wwwatch"]
members = ["wwwidgets", "app", "common", "wwwatch"]

[workspace.dependencies]
common = { path = "common" }
traccia = "2.2.5"
gtk4 = "0.10.2"
gtk4-layer-shell = "0.7.0"
tokio = { version = "1.48.0", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
clap = { version = "4.5.51", features = ["derive"] }
webkit6 = "0.5.0"
